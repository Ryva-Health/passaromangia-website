<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4CAF50" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ryva" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Primary meta (per-route values are injected at build time by scripts/prerender.mjs) -->
    <title>Ryva — AI Food Scanner for Personalized Health Scores</title>
    <meta name="description" content="Scan any food or cosmetic barcode for a health score personalized to your dietary goals. Uncover hidden additives and get AI nutrition advice — free on iOS." />
    <link rel="canonical" href="https://www.ryva.health/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Passaro Technologies LLC" />
    <meta name="publisher" content="Ryva" />
    <meta name="application-name" content="Ryva" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Ryva" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.ryva.health/" />
    <meta property="og:title" content="Ryva — AI Food Scanner for Personalized Health Scores" />
    <meta property="og:description" content="Scan any food or cosmetic barcode for a health score personalized to your dietary goals. Uncover hidden additives and get AI nutrition advice — free on iOS." />
    <meta property="og:image" content="https://www.ryva.health/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Ryva — AI food scanner for personalized health scores" />

    <!-- Twitter (title/description fall back to Open Graph) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@takingprophets" />
    <meta name="twitter:creator" content="@takingprophets" />
    <meta name="twitter:image" content="https://www.ryva.health/og-image.png" />
    <meta name="twitter:image:alt" content="Ryva — AI food scanner for personalized health scores" />

    <!-- Fonts (preconnect + non-blocking stylesheet) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <!-- Sitewide structured data: Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.ryva.health/#organization",
            "name": "Ryva",
            "legalName": "Passaro Technologies LLC",
            "url": "https://www.ryva.health",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.ryva.health/ryva-logo-icon.png"
            },
            "sameAs": [
              "https://x.com/takingprophets",
              "https://instagram.com/takingprophets",
              "https://tiktok.com/@takingprophets"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@ryva.health",
              "availableLanguage": ["English"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.ryva.health/#website",
            "url": "https://www.ryva.health",
            "name": "Ryva",
            "publisher": { "@id": "https://www.ryva.health/#organization" },
            "inLanguage": "en-US"
          }
        ]
      }
    </script>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
